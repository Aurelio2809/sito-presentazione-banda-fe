name: Deploy Frontend to VPS

on:
  push:
    branches:
      - integrazione
  pull_request:
    branches:
      - integrazione

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, test and build FE
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Lint TypeScript and Angular templates
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build production frontend
        run: npm run build

      - name: Verify production theme stylesheet
        run: npm run test:theme-build

  deploy:
    name: Deploy FE
    runs-on: self-hosted
    needs: quality
    if: github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Deploy through restricted host command
        run: sudo -n /usr/local/sbin/deploy-sito-banda-frontend
