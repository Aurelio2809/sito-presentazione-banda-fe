name: Deploy Frontend to VPS

on:
  push:
    branches:
      - integrazione

jobs:
  deploy:
    name: SCP + Docker Deploy FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy FE source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "${{ secrets.VPS_PROJECT_PATH }}/sito-presentazione-banda-fe-new"
          strip_components: 0

      - name: Build and restart frontend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            docker compose up --build -d frontend
            echo "✅ FE Deploy completato"
