name: Deploy Frontend to VPS

on:
  push:
    branches:
      - integrazione

jobs:
  deploy:
    name: SSH Deploy FE
    runs-on: ubuntu-latest

    steps:
      - name: Pull and rebuild frontend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}/sito-presentazione-banda-fe-new
            git pull origin integrazione
            cd ${{ secrets.VPS_PROJECT_PATH }}
            docker compose up --build -d frontend
            echo "✅ FE Deploy completato"
