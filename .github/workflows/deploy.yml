name: Deploy Frontend to VPS

on:
  push:
    branches:
      - integrazione

jobs:
  deploy:
    name: Deploy FE
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rebuild frontend container
        run: |
          cd ${{ secrets.VPS_PROJECT_PATH }}
          docker compose up --build -d frontend
          echo "✅ FE Deploy completato"
