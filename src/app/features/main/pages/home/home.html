<div class="home" [attr.data-anim]="animEnabled ? 'on' : 'off'">
  <app-home-section
    *ngFor="let s of sections; let i = index"
    #sec
    [key]="s.key"
    [attr.data-side]="i % 2 === 0 ? 'left' : 'right'"
[attr.data-index]="i"
    class="heroSectionHost"
  >
    <div class="copy-group reveal-group">
      <div class="top-crest order-0 reveal" *ngIf="s.crestImg" style="--d:0.02;">
        <img [src]="s.crestImg" alt="Stemma Associazione" loading="lazy" />
      </div>
      <app-home-title class="order-1 reveal" style="--d:0.10;" [text]="s.title | translate"></app-home-title>
      <app-home-subtitle-text class="order-3 reveal" style="--d:0.24;" [tag]="s.tag | translate" [text]="s.text | translate"></app-home-subtitle-text>
      <app-home-section-cta class="order-4 reveal" style="--d:0.34;" [text]="s.ctaText | translate" [link]="s.ctaLink"></app-home-section-cta>
    </div>

    <div class="media-group order-2 reveal" style="--d:0.16;">
      <app-home-image class="mobile-only" [images]="s.images" [alt]="s.title"></app-home-image>
      <app-home-image-desktop class="desktop-only" [images]="s.images"></app-home-image-desktop>
    </div>
  </app-home-section>
</div>
