<section class="about">
  <!-- HERO -->
  <app-page-header
    tag="Chi siamo"
    title="Musica, tradizione e comunità"
    [description]="headerDescription"
    [actions]="headerActions"
    [stats]="stats"
  ></app-page-header>

  <!-- SECTIONS -->
  <div class="blocks">
    <article class="block" *ngFor="let s of sections" [attr.data-side]="s.side">
      <div class="block__inner">
        <div class="block__grid">
          <div class="block__text">
            <div class="block__tag">{{ s.tag }}</div>
            <h2 class="block__title">{{ s.title }}</h2>
            <p class="block__desc">{{ s.text }}</p>

            <div class="block__actions">
              <a class="btn btn--primary" [routerLink]="s.link">{{ s.cta }}</a>
            </div>
          </div>

          <div class="block__media">
            <div class="mediaFrame">
              <img class="mediaImg" [src]="s.img" [alt]="s.title" loading="lazy" />
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>

  <!-- CTA finale -->
  <div class="cta">
    <div class="cta__inner">
      <div class="cta__text">
        <div class="cta__tag">Entra in contatto</div>
        <h3 class="cta__title">Vuoi suonare con noi o iscriverti alla scuola?</h3>
        <p class="cta__desc">
          Scrivici: ti rispondiamo con informazioni su prove, iscrizioni e attività.
        </p>
      </div>

      <div class="cta__actions">
        <a class="btn btn--primary" routerLink="/contacts">Scrivici</a>
      </div>
    </div>
  </div>
</section>
