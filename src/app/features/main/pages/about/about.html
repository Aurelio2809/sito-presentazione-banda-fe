<section class="about">
  <!-- HERO -->
  <app-page-header
    [tag]="'ABOUT.HEADER_TAG' | translate"
    [title]="'ABOUT.HEADER_TITLE' | translate"
    [description]="'ABOUT.HEADER_DESC' | translate"
    [actions]="headerActions"
    [stats]="stats"
  ></app-page-header>

  <!-- SECTIONS -->
  <div class="blocks">
    <article class="block" *ngFor="let s of sections" [attr.data-side]="s.side">
      <div class="block__inner">
        <div class="block__grid">
          <div class="block__text">
            <div class="block__tag">{{ s.tag | translate }}</div>
            <h2 class="block__title">{{ s.title | translate }}</h2>
            <p class="block__desc">{{ s.text | translate }}</p>

            <div class="block__actions">
              <a class="btn btn--primary" [routerLink]="s.link">{{ s.cta | translate }}</a>
            </div>
          </div>

          <div class="block__media">
            <div class="mediaFrame">
              <img class="mediaImg" [appResponsiveImage]="s.img" [alt]="s.title | translate" loading="lazy" decoding="async" />
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>

  <!-- CTA finale -->
  <div class="cta">
    <div class="cta__inner">
      <div class="cta__text">
        <div class="cta__tag">{{ 'ABOUT.FINAL_TAG' | translate }}</div>
        <h3 class="cta__title">{{ 'ABOUT.FINAL_TITLE' | translate }}</h3>
        <p class="cta__desc">
          {{ 'ABOUT.FINAL_DESC' | translate }}
        </p>
      </div>

      <div class="cta__actions">
        <a class="btn btn--primary" routerLink="/contacts">{{ 'ABOUT.FINAL_CTA' | translate }}</a>
      </div>
    </div>
  </div>
</section>
