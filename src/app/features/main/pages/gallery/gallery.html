<!-- src/app/features/main/pages/gallery/gallery.html -->
<section class="gallery">
  <header class="gallery__head">
    <div class="gallery__tag">Galleria</div>
    <h1 class="gallery__title">Galleria fotografica</h1>
    <p class="gallery__desc">
      Scopri le immagini più belle della nostra banda: concerti, prove, eventi e momenti speciali.
    </p>
  </header>

  <!-- Loading state -->
  <div class="gallery__loading" *ngIf="loading">
    <p>Caricamento galleria...</p>
  </div>

  <!-- Error state -->
  <div class="gallery__error" *ngIf="error">
    <p>{{ error }}</p>
  </div>

  <!-- Mosaic (foto preferite) - mostra se ci sono almeno 1 preferita -->
  <div class="mosaic" *ngIf="!loading && heroMain && favorites.length >= 1" 
       [class.mosaic--compact]="favorites.length < 5">
    <button class="tile tile--hero" type="button" (click)="open(heroMain)">
      <img class="tile__img" [src]="getPhotoUrl(heroMain)" [alt]="heroMain.title" />
      <div class="tile__overlay">
        <div class="tile__kicker">Preferita</div>
        <div class="tile__title">{{ heroMain.title }}</div>
      </div>
    </button>

    <button class="tile tile--right1" type="button" (click)="open(favorites[1])" *ngIf="favorites[1]">
      <img class="tile__img" [src]="getPhotoUrl(favorites[1])" [alt]="favorites[1].title" />
      <div class="tile__overlay">
        <div class="tile__title">{{ favorites[1].title }}</div>
      </div>
    </button>

    <button class="tile tile--right2" type="button" (click)="open(favorites[2])" *ngIf="favorites[2]">
      <img class="tile__img" [src]="getPhotoUrl(favorites[2])" [alt]="favorites[2].title" />
      <div class="tile__overlay">
        <div class="tile__title">{{ favorites[2].title }}</div>
      </div>
    </button>

    <button class="tile tile--bottom1" type="button" (click)="open(favorites[3])" *ngIf="favorites[3]">
      <img class="tile__img" [src]="getPhotoUrl(favorites[3])" [alt]="favorites[3].title" />
      <div class="tile__overlay">
        <div class="tile__title">{{ favorites[3].title }}</div>
      </div>
    </button>

    <button class="tile tile--bottom2" type="button" (click)="open(favorites[4])" *ngIf="favorites[4]">
      <img class="tile__img" [src]="getPhotoUrl(favorites[4])" [alt]="favorites[4].title" />
      <div class="tile__overlay">
        <div class="tile__title">{{ favorites[4].title }}</div>
      </div>
    </button>

    <button class="tile tile--corner" type="button" (click)="open(favorites[5])" *ngIf="favorites[5]">
      <img class="tile__img" [src]="getPhotoUrl(favorites[5])" [alt]="favorites[5].title" />
      <div class="tile__overlay">
        <div class="tile__title">{{ favorites[5].title }}</div>
      </div>
    </button>
  </div>

  <div class="gallery__spacer"></div>

  <!-- GRID (paginata) -->
  <div class="grid" *ngIf="!loading && items.length > 0">
    <button class="gridCard" type="button" *ngFor="let it of pagedItems" (click)="open(it)">
      <div class="gridCard__frame">
        <img class="gridCard__img" [src]="getPhotoUrl(it)" [alt]="it.title" loading="lazy" />
      </div>
      <div class="gridCard__meta">
        <div class="gridCard__title">{{ it.title }}</div>
      </div>
    </button>
  </div>

  <!-- Empty state -->
  <div class="gallery__empty" *ngIf="!loading && items.length === 0 && !error">
    <p>Nessuna foto disponibile al momento.</p>
  </div>

  <!-- NAVIGATORE PAGINE -->
  <app-ui-simple-page-navigator
    *ngIf="totalElements > 0"
    [totalItems]="totalElements"
    [page]="page + 1"
    [pageSize]="pageSize"
    [pageSizeOptions]="[6, 9, 12, 18]"
    [showPageSize]="true"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  ></app-ui-simple-page-navigator>
</section>

<!-- VIEWER -->
<div class="viewer" *ngIf="viewerOpen" (click)="close()">
  <div class="viewer__panel" (click)="$event.stopPropagation()">
    <button class="viewer__close" type="button" (click)="close()" aria-label="Chiudi">✕</button>

    <div class="viewer__content" *ngIf="selected as s">
      <div class="viewer__media">
        <img class="viewer__img" [src]="getPhotoUrl(s)" [alt]="s.title" />
      </div>

      <aside class="viewer__info">
        <div class="viewer__tag">Dettagli</div>
        <h2 class="viewer__title">{{ s.title }}</h2>
        <p class="viewer__desc">{{ s.description }}</p>

        <div class="viewer__spacer" aria-hidden="true"></div>

        <div class="viewer__meta">
          <div class="metaItem" *ngIf="s.location">
            <div class="metaItem__label">Luogo</div>
            <div class="metaItem__value">{{ s.location }}</div>
          </div>

          <div class="metaItem" *ngIf="s.photoDate">
            <div class="metaItem__label">Data</div>
            <div class="metaItem__value">{{ s.photoDate }}</div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
