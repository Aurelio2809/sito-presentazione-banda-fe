<section class="events">
  <app-page-header
    [tag]="'EVENTS.TAG' | translate"
    [title]="'EVENTS.TITLE' | translate"
    [description]="'EVENTS.DESC' | translate"
  ></app-page-header>

  <!-- Loading state -->
  <app-loading-spinner *ngIf="loading" [message]="'EVENTS.LOADING' | translate"></app-loading-spinner>

  <!-- Error state -->
  <app-empty-state
    *ngIf="!loading && error"
    icon="calendar"
    tone="error"
    [title]="'EVENTS.ERROR_TITLE' | translate"
    [text]="'EVENTS.ERROR_DESC' | translate"
    [actionLabel]="'EVENTS.ERROR_CTA' | translate"
    actionLink="/contacts"
  ></app-empty-state>

  <!-- Tabs -->
  <div class="tabs" *ngIf="!loading && !error">
    <button
      class="tab"
      type="button"
      [class.is-active]="tab === 'upcoming'"
      (click)="setTab('upcoming')"
    >
      {{ 'EVENTS.TAB_UPCOMING' | translate }}
      <span class="tab__badge" *ngIf="upcomingEvents.length > 0">{{ upcomingEvents.length }}</span>
    </button>

    <button
      class="tab"
      type="button"
      [class.is-active]="tab === 'past'"
      (click)="setTab('past')"
    >
      {{ 'EVENTS.TAB_PAST' | translate }}
      <span class="tab__badge" *ngIf="pastEvents.length > 0">{{ pastEvents.length }}</span>
    </button>
  </div>

  <div class="layout" *ngIf="!loading && !error">
    <!-- LEFT: Events list -->
    <div class="col">
      <div class="sectionHead">
        <h2 class="sectionHead__title">
          {{ (tab === 'upcoming' ? 'EVENTS.HEAD_UPCOMING' : 'EVENTS.HEAD_PAST') | translate }}
        </h2>
        <p class="sectionHead__desc">
          {{ (tab === 'upcoming' ? 'EVENTS.HEAD_UPCOMING_DESC' : 'EVENTS.HEAD_PAST_DESC') | translate }}
        </p>
      </div>

      <div class="ticketList" *ngIf="tab === 'upcoming'">
        <button
          class="ticket"
          type="button"
          *ngFor="let e of upcomingEvents"
          [class.is-open]="openEventId === e.id"
          [class.ticket--no-banner]="!e.bannerSrc"
          (click)="toggleEvent(e.id)"
        >
          <div class="ticket__banner" *ngIf="e.bannerSrc">
            <img class="ticket__img" [src]="e.bannerSrc" [alt]="e.title" />
            <div class="ticket__shade"></div>
          </div>

          <div class="ticket__body">
            <div class="ticket__top">
              <div class="ticket__title">{{ e.title }}</div>

              <div class="ticket__meta">
                <span class="metaPill">
                  <span class="metaPill__label">{{ 'EVENTS.META_DATE' | translate }}</span>
                  <span class="metaPill__value">{{ formatDate(e.eventDate) }}</span>
                </span>

                <span class="metaPill" *ngIf="e.eventTime">
                  <span class="metaPill__label">{{ 'EVENTS.META_TIME' | translate }}</span>
                  <span class="metaPill__value">{{ formatTime(e.eventTime) }}</span>
                </span>

                <span class="metaPill metaPill--place" *ngIf="e.location">
                  <span class="metaPill__label">{{ 'EVENTS.META_PLACE' | translate }}</span>
                  <span class="metaPill__value">{{ e.location }}</span>
                </span>
              </div>
            </div>

            <div class="ticket__desc">{{ e.shortDescription }}</div>

            <div class="ticket__tags" *ngIf="e.tags?.length">
              <span class="tag" *ngFor="let t of e.tags">{{ t }}</span>
            </div>

            <div class="ticket__details" *ngIf="openEventId === e.id">
              <div class="details__text">{{ e.fullDescription }}</div>

              <div class="details__row">
                <div class="details__place" *ngIf="e.cityLine">
                  <span class="details__k">{{ 'EVENTS.META_ZONE' | translate }}</span>
                  <span class="details__v">{{ e.cityLine }}</span>
                </div>

                <a
                  class="attach"
                  *ngIf="e.attachmentHref"
                  [href]="e.attachmentHref"
                  target="_blank"
                  rel="noopener"
                  (click)="$event.stopPropagation()"
                >
                  <span class="attach__dot" aria-hidden="true"></span>
                  <span class="attach__label">{{ e.attachmentLabel || ('EVENTS.ATTACH' | translate) }}</span>
                  <span class="attach__chev" aria-hidden="true">↗</span>
                </a>
              </div>
            </div>
          </div>

          <div class="ticket__rail" aria-hidden="true">
            <div class="ticket__cut ticket__cut--top"></div>
            <div class="ticket__cut ticket__cut--bottom"></div>
          </div>
        </button>
      </div>

      <div class="ticketList" *ngIf="tab === 'past'">
        <button
          class="ticket"
          type="button"
          *ngFor="let e of pastEvents"
          [class.is-open]="openEventId === e.id"
          [class.ticket--no-banner]="!e.bannerSrc"
          (click)="toggleEvent(e.id)"
        >
          <div class="ticket__banner" *ngIf="e.bannerSrc">
            <img class="ticket__img" [src]="e.bannerSrc" [alt]="e.title" />
            <div class="ticket__shade"></div>
          </div>

          <div class="ticket__body">
            <div class="ticket__top">
              <div class="ticket__title">{{ e.title }}</div>

              <div class="ticket__meta">
                <span class="metaPill">
                  <span class="metaPill__label">{{ 'EVENTS.META_DATE' | translate }}</span>
                  <span class="metaPill__value">{{ formatDate(e.eventDate) }}</span>
                </span>

                <span class="metaPill" *ngIf="e.eventTime">
                  <span class="metaPill__label">{{ 'EVENTS.META_TIME' | translate }}</span>
                  <span class="metaPill__value">{{ formatTime(e.eventTime) }}</span>
                </span>

                <span class="metaPill metaPill--place" *ngIf="e.location">
                  <span class="metaPill__label">{{ 'EVENTS.META_PLACE' | translate }}</span>
                  <span class="metaPill__value">{{ e.location }}</span>
                </span>
              </div>
            </div>

            <div class="ticket__desc">{{ e.shortDescription }}</div>

            <div class="ticket__tags" *ngIf="e.tags?.length">
              <span class="tag" *ngFor="let t of e.tags">{{ t }}</span>
            </div>

            <div class="ticket__details" *ngIf="openEventId === e.id">
              <div class="details__text">{{ e.fullDescription }}</div>

              <div class="details__row">
                <div class="details__place" *ngIf="e.cityLine">
                  <span class="details__k">{{ 'EVENTS.META_ZONE' | translate }}</span>
                  <span class="details__v">{{ e.cityLine }}</span>
                </div>

                <a
                  class="attach"
                  *ngIf="e.attachmentHref"
                  [href]="e.attachmentHref"
                  target="_blank"
                  rel="noopener"
                  (click)="$event.stopPropagation()"
                >
                  <span class="attach__dot" aria-hidden="true"></span>
                  <span class="attach__label">{{ e.attachmentLabel || ('EVENTS.ATTACH' | translate) }}</span>
                  <span class="attach__chev" aria-hidden="true">↗</span>
                </a>
              </div>
            </div>
          </div>

          <div class="ticket__rail" aria-hidden="true">
            <div class="ticket__cut ticket__cut--top"></div>
            <div class="ticket__cut ticket__cut--bottom"></div>
          </div>
        </button>
      </div>

      <app-empty-state
        *ngIf="tab === 'upcoming' && upcomingEvents.length === 0"
        icon="calendar"
        [compact]="true"
        [title]="'EVENTS.EMPTY_UPCOMING_TITLE' | translate"
        [text]="'EVENTS.EMPTY_UPCOMING' | translate"
        [actionLabel]="'EVENTS.EMPTY_CTA' | translate"
        actionLink="/contacts"
      ></app-empty-state>

      <app-empty-state
        *ngIf="tab === 'past' && pastEvents.length === 0"
        icon="calendar"
        [compact]="true"
        [title]="'EVENTS.EMPTY_PAST_TITLE' | translate"
        [text]="'EVENTS.EMPTY_PAST' | translate"
      ></app-empty-state>
    </div>

    <!-- RIGHT: Announcements -->
    <aside class="col">
      <div class="card card--soft">
        <h2 class="card__title">{{ 'EVENTS.ANN_TITLE' | translate }}</h2>
        <p class="card__desc">
          {{ 'EVENTS.ANN_DESC' | translate }}
        </p>

        <div class="annList">
          <button
            class="ann"
            type="button"
            *ngFor="let a of announcements"
            [class.is-open]="openAnnouncementId === a.id"
            (click)="toggleAnnouncement(a.id)"
          >
            <div class="ann__top">
              <div class="ann__title">{{ a.title }}</div>
              <div class="ann__date">{{ formatDate(a.eventDate) }}</div>
            </div>

            <div class="ann__short" *ngIf="openAnnouncementId !== a.id">{{ a.shortDescription }}</div>
            <div class="ann__full" *ngIf="openAnnouncementId === a.id">{{ a.fullDescription || a.shortDescription }}</div>

            <div class="ann__cta">
              <span class="ann__btn">
                {{ (openAnnouncementId === a.id ? 'EVENTS.ANN_CLOSE' : 'EVENTS.ANN_READ') | translate }}
              </span>
            </div>
          </button>
        </div>

        <app-empty-state
          *ngIf="announcements.length === 0"
          icon="announcement"
          [compact]="true"
          [title]="'EVENTS.ANN_EMPTY_TITLE' | translate"
          [text]="'EVENTS.ANN_EMPTY' | translate"
        ></app-empty-state>
      </div>
    </aside>
  </div>

  <div class="eventsSpacer" aria-hidden="true"></div>
</section>
