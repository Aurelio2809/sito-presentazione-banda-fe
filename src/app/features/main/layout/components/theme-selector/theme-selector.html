<div class="themeSelector" [class.themeSelector--mobile]="variant === 'mobile'">
  <button
    class="themeSelector__toggle"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    [attr.aria-label]="'NAV.SELECT_THEME' | translate"
    [title]="'NAV.SELECT_THEME' | translate"
  >
    <svg *ngIf="theme.mode() === 'auto'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8" />
      <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <path d="M12 7a3.5 3.5 0 100 7V7z" fill="currentColor" />
      <circle cx="12" cy="10.5" r="3.5" stroke="currentColor" stroke-width="1.4" />
    </svg>
    <svg *ngIf="theme.mode() === 'light'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    <svg *ngIf="theme.mode() === 'dark'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20 15.2A8.4 8.4 0 118.8 4a6.7 6.7 0 0011.2 11.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    </svg>
  </button>

  <div class="themeSelector__menu" [class.is-open]="isOpen" role="menu">
    <button
      *ngFor="let option of options"
      class="themeSelector__option"
      type="button"
      role="menuitemradio"
      [class.is-active]="theme.mode() === option.mode"
      [attr.aria-checked]="theme.mode() === option.mode"
      (click)="select(option.mode)"
    >
      <span class="themeSelector__optionIcon" aria-hidden="true">
        <span *ngIf="option.mode === 'auto'">◐</span>
        <span *ngIf="option.mode === 'light'">☀</span>
        <span *ngIf="option.mode === 'dark'">◑</span>
      </span>
      <span>{{ option.labelKey | translate }}</span>
      <svg *ngIf="theme.mode() === option.mode" class="themeSelector__check" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 10.5l3.4 3.4L16 5.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</div>
