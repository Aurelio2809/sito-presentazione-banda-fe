<div class="dashShell">
  <!-- HEADER -->
  <header class="dashHeader">
    <div class="dashHeader__inner">
      <a class="brand" routerLink="/dashboard">
        <span class="brand__mark" aria-hidden="true">
          <img class="brand__crest" src="/assets/responsive/stemma/stemma-512.webp" alt="" />
        </span>
        <span class="brand__text">
          <span class="brand__title">Banda Musicale</span>
          <span class="brand__subtitle">Città di Casali del Manco</span>
        </span>
      </a>

      <div class="dashHeader__actions">
        <a class="dashHeader__siteLink" routerLink="/" title="Vai al sito pubblico">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Vai al sito</span>
        </a>
        <a class="dashHeader__profileBtn" routerLink="/dashboard/profile" title="Area Personale">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- BODY (sidebar + content) -->
  <div class="dashBody">
    <app-dashboard-sidebar></app-dashboard-sidebar>

    <main class="dashContent">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="dashFooter">
    <div class="dashFooter__inner">
      <div class="dashFooter__copy">© {{ currentYear }} Banda Musicale Città di Casali del Manco — Area riservata</div>
      <div class="dashFooter__links">
        <a class="dashFooter__link" [href]="SOCIAL_URLS.facebook" target="_blank" rel="noopener">Facebook</a>
        <span class="dashFooter__dot">•</span>
        <a class="dashFooter__link" [href]="SOCIAL_URLS.instagram" target="_blank" rel="noopener">Instagram</a>
        <span class="dashFooter__dot">•</span>
        <a class="dashFooter__link" [href]="SOCIAL_URLS.tiktok" target="_blank" rel="noopener">TikTok</a>
        <span class="dashFooter__dot">•</span>
        <a class="dashFooter__link" [href]="SOCIAL_URLS.youtube" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
  </footer>

  <app-ui-feedback></app-ui-feedback>
</div>
