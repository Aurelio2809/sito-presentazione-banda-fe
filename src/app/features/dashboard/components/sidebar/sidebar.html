<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <div class="sidebar__header">
    <div class="sidebar__logo" *ngIf="!collapsed">
      <span class="sidebar__logoText">Gestione</span>
    </div>
    <button class="sidebar__toggle" type="button" (click)="toggle()" [attr.aria-label]="collapsed ? 'Espandi menu' : 'Comprimi menu'">
      <svg viewBox="0 0 24 24" fill="none">
        <path *ngIf="!collapsed" d="M11 17l-5-5 5-5M18 17l-5-5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path *ngIf="collapsed" d="M13 17l5-5-5-5M6 17l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav">
    <a
      *ngFor="let item of menuItems"
      class="sidebar__link"
      [routerLink]="item.route"
      routerLinkActive="sidebar__link--active"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
    >
      <span class="sidebar__icon">
        <!-- Grid -->
        <svg *ngIf="item.icon === 'grid'" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
        </svg>
        <!-- Image -->
        <svg *ngIf="item.icon === 'image'" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="2"/>
          <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Calendar -->
        <svg *ngIf="item.icon === 'calendar'" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <!-- Mail -->
        <svg *ngIf="item.icon === 'mail'" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Activity -->
        <svg *ngIf="item.icon === 'activity'" viewBox="0 0 24 24" fill="none">
          <polyline points="22,12 18,12 15,21 9,3 6,12 2,12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- User -->
        <svg *ngIf="item.icon === 'user'" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="sidebar__label" *ngIf="!collapsed">{{ item.label }}</span>
      <span class="sidebar__badge" *ngIf="item.badge && item.badge > 0 && !collapsed">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <a class="sidebar__backLink" routerLink="/">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span *ngIf="!collapsed">Torna al sito</span>
    </a>
  </div>
</aside>
