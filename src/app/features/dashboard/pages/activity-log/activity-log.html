<div class="activityPage">
  <header class="pageHeader">
    <div class="pageHeader__left">
      <h1 class="pageHeader__title">Tracciamento Attività</h1>
      <p class="pageHeader__desc">Registro delle azioni eseguite nella dashboard</p>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="filtersWrap">
    <app-tab-switch
      [tabs]="filterTabs"
      [activeTab]="activeFilter"
      (tabChange)="onFilterChange($event)"
    ></app-tab-switch>
  </div>

  <!-- ACTIVITY LIST -->
  <div class="activityList">
    <div class="activityItem" *ngFor="let activity of filteredActivities" [attr.data-color]="getActionColor(activity.action)">
      <div class="activityItem__icon" [attr.data-type]="activity.targetType">
        <!-- Image -->
        <svg *ngIf="activity.targetType === 'PHOTO'" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="2"/>
          <path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Calendar -->
        <svg *ngIf="activity.targetType === 'EVENT'" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <!-- Megaphone -->
        <svg *ngIf="activity.targetType === 'ANNOUNCEMENT'" viewBox="0 0 24 24" fill="none">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Mail -->
        <svg *ngIf="activity.targetType === 'MESSAGE'" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Settings -->
        <svg *ngIf="activity.targetType === 'SETTINGS'" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <!-- User -->
        <svg *ngIf="activity.targetType === 'USER'" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="activityItem__content">
        <div class="activityItem__text">
          <span class="activityItem__user">{{ activity.username }}</span>
          <span class="activityItem__action">{{ formatAction(activity.action) }}</span>
          <span class="activityItem__target">{{ activity.targetName }}</span>
        </div>
        <div class="activityItem__details" *ngIf="activity.details">{{ activity.details }}</div>
      </div>

      <div class="activityItem__time">
        {{ activity.timestamp | date:'dd/MM/yyyy HH:mm' }}
      </div>
    </div>

    <div class="emptyState" *ngIf="filteredActivities.length === 0">
      <p>Nessuna attività trovata</p>
    </div>
  </div>
</div>
