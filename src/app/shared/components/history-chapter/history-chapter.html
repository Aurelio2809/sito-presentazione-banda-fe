<section class="chapter" [attr.id]="id" [class.chapter--closed]="!isOpen">
  <button class="chapter__head" type="button" (click)="toggle()">
    <div class="chapter__headContent">
      <div class="chapter__kicker" *ngIf="kicker">{{ kicker }}</div>
      <h2 class="chapter__title">{{ title }}</h2>
      <p class="chapter__subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    </div>

    <div class="chapter__toggle" [class.chapter__toggle--open]="isOpen">
      <svg class="chapter__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </button>

  <div class="chapter__body" [class.chapter__body--open]="isOpen">
    <div class="chapter__bodyInner">
      <div class="chapter__media" *ngIf="images.length">
        <div class="chapterGrid" [class.chapterGrid--2]="images.length >= 2">
          <figure class="chapFig" *ngFor="let im of images; let i = index" [class.chapFig--wide]="i === 0">
            <img class="chapImg" [src]="im.src" [alt]="im.alt" loading="lazy" />
          </figure>
        </div>
      </div>

      <!-- Contenuto passato via ng-content (modo preferito) -->
      <div class="chapter__prose">
        <ng-content></ng-content>

        <!-- Fallback: paragraphs via input (legacy) -->
        <p *ngFor="let p of paragraphs">{{ p }}</p>

        <div class="chapter__callout" *ngIf="callout">
          <p>{{ callout }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
